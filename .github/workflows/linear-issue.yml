name: Linear issue requirement

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  linear-issue:
    # The job name is the required check name in rulesets. Keep it unchanged.
    name: Linear issue
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Logic lives in anybridge.skills (ADR 0002). To exempt automation apps, add:
      #   with:
      #     exempt-authors: |
      #       my-app[bot]
      - uses: anybridge-ai/anybridge.skills/.github/actions/linear-issue@main
